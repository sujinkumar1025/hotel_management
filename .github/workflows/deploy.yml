name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main   # Trigger the workflow on push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use the latest Ubuntu image for the job

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Check out the code from the repository

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'  # You can specify the version of Node.js you need

    - name: Install dependencies
      run: npm install  # Install dependencies from package.json

    - name: Build the app
      run: npm run build  # Build the app for production

    - name: Deploy to GitHub Pages
      run: |
        npm install --save gh-pages  # Install gh-pages if not already installed
        npm run deploy  # Run the deploy script from package.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automatically generated by GitHub, used for deployment
